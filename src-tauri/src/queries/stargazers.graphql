query Stargazers($id: ID!, $cursor: String) {
  node(id: $id) {
    ... on Repository {
      stargazers(first: 100, after: $cursor, orderBy: { field: STARRED_AT, direction: DESC }) {
        pageInfo { hasNextPage endCursor }
        edges { starredAt node { login avatarUrl } }
      }
    }
  }
}
