name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the packages to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # Stops the release when the tag and the version in the sources differ.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the tag matches the version
        run: |
          npm=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          app=$(jq -r .version src-tauri/tauri.conf.json)
          for found in "$npm" "$cargo" "$app"; do
            if [ "${TAG#v}" != "$found" ]; then
              echo "$TAG does not match package.json ($npm), Cargo.toml ($cargo) and tauri.conf.json ($app)" >&2
              exit 1
            fi
          done

  linux-packages:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev \
            pkg-config patchelf

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend first through beforeBuildCommand.
      - name: Build the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: TAURI_LINUX_AYATANA_APPINDICATOR=true pnpm app:build

      # The tray icon needs this library, so the package has to ask for it.
      - name: Check the package dependencies
        run: dpkg-deb -f src-tauri/target/release/bundle/deb/*.deb Depends | grep libayatana-appindicator3-1

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/*.sig \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/rpm/*.sig \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.sig

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The key signs every release, so a newer APK installs over an older one.
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/birdfeeder.jks"
          {
            echo "storeFile=$RUNNER_TEMP/birdfeeder.jks"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=birdfeeder"
          } > src-tauri/gen/android/keystore.properties

      # Phones run arm64 or armv7; x86_64 covers Chromebooks and emulators.
      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Birdfeeder_${TAG#v}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$apk"
          gh release upload "$TAG" --clobber "$apk"

  # The updater reads this file from the latest release, and phones learn of a new version
  # from it, so it waits until every package is attached.
  manifest:
    needs: [linux-packages, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Write latest.json and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir signatures --pattern '*.sig'
          gh release view "$TAG" --json body --jq .body > notes.md
          .github/scripts/latest-json.sh "$TAG" signatures notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
